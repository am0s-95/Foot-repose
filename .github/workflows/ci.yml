name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foot_repose_test
        # Deliberately NOT 5432. This job runs `npm run test`, which is where a
        # test once dialled a hardcoded 127.0.0.1:5432 and dropped whatever
        # database it found there, ignoring TEST_DATABASE_URL entirely. On a
        # non-default host port that mistake cannot connect at all, so it fails
        # the job instead of destroying data on somebody's machine.
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:55432/foot_repose_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Assert the pinned PostgreSQL server version
        run: |
          PGPASSWORD=postgres psql -h localhost -p 55432 -U postgres -d foot_repose_test \
            -c 'SELECT version();' -tA
          num=$(PGPASSWORD=postgres psql -h localhost -p 55432 -U postgres -d foot_repose_test \
            -tAc 'SHOW server_version_num')
          echo "server_version_num=$num"
          test "$num" = "160013" || {
            echo "::error::expected PostgreSQL 16.13 (160013), got $num"; exit 1; }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foot_repose_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/foot_repose_dev
      AUTH_SECRET: ci-e2e-secret-0123456789abcdef0123456789abcdef
      SEED_CONFIRM: wipe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Assert the pinned PostgreSQL server version
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d foot_repose_dev \
            -c 'SELECT version();' -tA
          num=$(PGPASSWORD=postgres psql -h localhost -U postgres -d foot_repose_dev \
            -tAc 'SHOW server_version_num')
          echo "server_version_num=$num"
          test "$num" = "160013" || {
            echo "::error::expected PostgreSQL 16.13 (160013), got $num"; exit 1; }
      - run: npm ci
      - run: npm run db:migrate
      # No seed step: Playwright's globalSetup seeds for an explicit Muscat
      # reference date. A seed here would race it and would reintroduce the
      # dependency on whatever weekday CI happens to run.
      - run: npx playwright install --with-deps chromium
      - run: npm run build -w @foot-repose/api -w @foot-repose/branch-app -w @foot-repose/customer-app
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
